<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker Data Export</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; opacity: .7; font-size: 13px; }
  button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid #8888;
           background: #8882; cursor: pointer; margin-bottom: 12px; }
  pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.45 ui-monospace, Menlo, monospace;
        background: #8881; padding: 12px; border-radius: 8px; }
  .empty { color: #c0392b; font-weight: 600; }
</style>
</head>
<body>
<h1>Tracker Data Export</h1>
<p class="sub">Reads everything this site saved in this browser. Open on the phone and browser you trained with.</p>
<button id="copy">Copy all</button>
<pre id="out">reading...</pre>
<script>
(function () {
  var dump = {}, n = 0;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i), v = localStorage.getItem(k);
      try { dump[k] = JSON.parse(v); } catch (e) { dump[k] = v; }
      n++;
    }
  } catch (e) {
    document.getElementById('out').textContent = 'Could not read storage: ' + e.message;
    return;
  }
  var out = document.getElementById('out');
  if (n === 0) {
    out.innerHTML = '<span class="empty">Nothing saved in this browser.</span>\n\n' +
      'Either this is not the browser you logged workouts in, or the data was cleared.\n' +
      'Try Safari vs Chrome, and make sure you are on the same phone.';
    return;
  }
  out.textContent = JSON.stringify(dump, null, 2);
  document.getElementById('copy').onclick = function () {
    navigator.clipboard.writeText(out.textContent).then(
      function () { document.getElementById('copy').textContent = 'Copied'; },
      function () { document.getElementById('copy').textContent = 'Select the text and copy manually'; }
    );
  };
})();
</script>
</body>
</html>
